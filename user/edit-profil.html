<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profil - FoundIt</title>

    <link rel="stylesheet" href="../css/user.css">
    <link rel="stylesheet" href="../css/profil.css">
    <link rel="stylesheet" href="../css/edit-profil.css">
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <span>Found</span>It
        </div>

        <nav>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="cari-barang.html">
                Cari Barang
            </a>

            <a href="lapor-hilang.html">
                Lapor Barang Hilang
            </a>

            <a href="lapor-ditemukan.html">
                Lapor Barang Ditemukan
            </a>

            <a href="klaim.html">
                Klaim Barang
            </a>

            <a href="status-klaim.html">
                Status Klaim
            </a>

            <a href="riwayat-laporan.html">
                Riwayat Laporan
            </a>

            <a href="profil.html" class="active">
                Profil
            </a>

        </nav>

        <a href="../login.html" class="logout">
            Keluar
        </a>

    </aside>


    <!-- MAIN -->
    <main class="main-content">

        <!-- TOPBAR -->
        <header class="topbar">

            <div>
                <h1>Edit Profil</h1>

                <p>
                    Perbarui informasi akun kamu.
                </p>
            </div>

        </header>


        <!-- FORM -->
        <section class="edit-profile-card">

            <div class="edit-header">

                <h2>Informasi Pribadi</h2>

                <p>
                    Ubah data yang ingin kamu perbarui.
                </p>

            </div>


            <form id="editProfileForm">

                <div class="form-row">

                    <div class="form-group">

                        <label for="nama">
                            Nama Lengkap
                        </label>

                        <input
                            type="text"
                            id="nama"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="nim">
                            NIM
                        </label>

                        <input
                            type="text"
                            id="nim"
                            required>

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="fakultas">
                            Fakultas
                        </label>

                        <input
                            type="text"
                            id="fakultas"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="jurusan">
                            Program Studi
                        </label>

                        <input
                            type="text"
                            id="jurusan"
                            required>

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="angkatan">
                            Angkatan
                        </label>

                        <input
                            type="text"
                            id="angkatan"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            required>

                    </div>

                </div>


                <div class="form-group">

                    <label for="nohp">
                        Nomor WhatsApp
                    </label>

                    <input
                        type="tel"
                        id="nohp"
                        required>

                </div>


                <div class="form-actions">

                    <a
                        href="profil.html"
                        class="btn-cancel">
                        Batal
                    </a>

                    <button
                        type="submit"
                        class="btn-save">
                        Simpan Perubahan
                    </button>

                </div>

            </form>

        </section>

    </main>


    <script src="../js/edit-profil.js"></script>

</body>

</html>
