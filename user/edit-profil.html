<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profil - FoundIt</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/bootstrap-override.css">
    <link rel="stylesheet" href="../css/user.css">
    <link rel="stylesheet" href="../css/profil.css">
    <link rel="stylesheet" href="../css/edit-profil.css">
</head>
<body>

    <aside class="sidebar">
        <div class="logo"><span>Found</span>It</div>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="cari-barang.html">Cari Barang</a>
            <a href="lapor-hilang.html">Lapor Barang Hilang</a>
            <a href="lapor-ditemukan.html">Lapor Barang Ditemukan</a>
            <a href="klaim.html">Klaim Barang</a>
            <a href="status-klaim.html">Status Klaim</a>
            <a href="riwayat-laporan.html">Riwayat Laporan</a>
            <a href="profil.html" class="active">Profil</a>
        </nav>
        <a href="../login.html" class="logout">Keluar</a>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <div>
                <h1>Edit Profil</h1>
                <p>Perbarui informasi akun kamu.</p>
            </div>
        </header>

        <section class="edit-profile-card">
            <div class="edit-header">
                <h2>Informasi Pribadi</h2>
                <p>Ubah data yang ingin kamu perbarui.</p>
            </div>

            <form id="editProfileForm">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="nama">Nama Lengkap</label>
                            <input type="text" id="nama" class="form-control" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="nim">NIM</label>
                            <input type="text" id="nim" class="form-control" required>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="fakultas">Fakultas</label>
                            <input type="text" id="fakultas" class="form-control" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="jurusan">Program Studi</label>
                            <input type="text" id="jurusan" class="form-control" required>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="angkatan">Angkatan</label>
                            <input type="text" id="angkatan" class="form-control" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="nohp">Nomor WhatsApp</label>
                    <input type="tel" id="nohp" class="form-control" required>
                </div>

                <div class="form-actions">
                    <a href="profil.html" class="btn-cancel">Batal</a>
                    <button type="submit" class="btn-save">Simpan Perubahan</button>
                </div>
            </form>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/edit-profil.js"></script>
</body>
</html>
