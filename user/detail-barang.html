<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Barang - FoundIt</title>

    <!-- Bootstrap dan CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/bootstrap-override.css">
    <link rel="stylesheet" href="../css/user.css">
    <link rel="stylesheet" href="../css/detail-barang.css">
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo"><span>Found</span>It</div>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="cari-barang.html" class="active">Cari Barang</a>
            <a href="lapor-hilang.html">Lapor Barang Hilang</a>
            <a href="lapor-ditemukan.html">Lapor Barang Ditemukan</a>
            <a href="klaim.html">Klaim Barang</a>
            <a href="status-klaim.html">Status Klaim</a>
            <a href="riwayat-laporan.html">Riwayat Laporan</a>
            <a href="profil.html">Profil</a>
        </nav>

        <a href="../login.html" class="logout">Keluar</a>
    </aside>

    <!-- MAIN -->
    <main class="main-content">

        <!-- TOPBAR -->
        <header class="topbar">
            <div>
                <h1>Detail Barang</h1>
                <p>Informasi lengkap mengenai barang.</p>
            </div>

            <!-- PROFIL USER -->
            <div class="user-profile">
                <div class="profile-icon" id="profileInitial">U</div>
                <div>
                    <strong id="profileName">User</strong>
                    <small>User</small>
                </div>
            </div>
        </header>

        <!-- DETAIL BARANG -->
        <section class="detail-container" id="detailContainer">

            <div class="row g-4">

                <!-- GAMBAR BARANG -->
                <div class="col-lg-5">
                    <div class="detail-image">
                        <img
                            src=""
                            alt="Gambar barang"
                            id="detailImage"
                        >
                    </div>
                </div>

                <!-- INFORMASI BARANG -->
                <div class="col-lg-7">
                    <div class="detail-content">

                        <!-- STATUS BARANG -->
                        <div class="detail-status">
                            <span
                                class="status-badge"
                                id="detailStatus"
                            ></span>
                        </div>

                        <!-- NAMA BARANG -->
                        <h2 id="detailName"></h2>

                        <!-- DESKRIPSI BARANG -->
                        <p
                            class="detail-description"
                            id="detailDescription"
                        ></p>

                        <!-- INFORMASI LENGKAP -->
                        <div class="row g-3 detail-info">

                            <!-- KATEGORI -->
                            <div class="col-md-6">
                                <div class="detail-item">
                                    <span>Kategori</span>
                                    <strong id="detailCategory"></strong>
                                </div>
                            </div>

                            <!-- LOKASI -->
                            <div class="col-md-6">
                                <div class="detail-item">
                                    <span>Lokasi</span>
                                    <strong id="detailLocation"></strong>
                                </div>
                            </div>

                            <!-- TANGGAL -->
                            <div class="col-md-6">
                                <div class="detail-item">
                                    <span>Tanggal</span>
                                    <strong id="detailDate"></strong>
                                </div>
                            </div>

                            <!-- STATUS -->
                            <div class="col-md-6">
                                <div class="detail-item">
                                    <span>Status</span>
                                    <strong id="detailStatusText"></strong>
                                </div>
                            </div>

                        </div>

                        <!-- TOMBOL AKSI -->
                        <div class="d-flex gap-3 flex-wrap detail-actions">

                            <a
                                href="cari-barang.html"
                                class="btn-secondary"
                            >
                                Kembali
                            </a>

                            <a
                                href="klaim.html"
                                class="btn-primary"
                                id="claimButton"
                            >
                                Ajukan Klaim
                            </a>

                        </div>

                    </div>
                </div>

            </div>

        </section>

    </main>

    <!-- JAVASCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/detail-barang.js"></script>

</body>
</html>
