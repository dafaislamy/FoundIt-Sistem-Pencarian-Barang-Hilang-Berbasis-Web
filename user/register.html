<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lengkapi Profil - FoundIt</title>

    <link rel="stylesheet" href="../css/register.css">
</head>

<body>

    <div class="register-container">

        <!-- BAGIAN KIRI -->
        <div class="register-info">

            <div class="logo">
                <span>Found</span>It
            </div>

            <h1>
                Lengkapi
                Profilmu.
            </h1>

            <p>
                Lengkapi data diri kamu agar dapat
                menggunakan seluruh fitur FoundIt.
            </p>

            <div class="steps">

                <div class="step active">
                    <span>1</span>
                    <div>
                        <strong>Data Diri</strong>
                        <small>Informasi mahasiswa</small>
                    </div>
                </div>

                <div class="step">
                    <span>2</span>
                    <div>
                        <strong>Profil Selesai</strong>
                        <small>Mulai menggunakan FoundIt</small>
                    </div>
                </div>

            </div>

        </div>


        <!-- BAGIAN KANAN -->
        <div class="register-box">

            <div class="register-header">

                <h2>Data Mahasiswa</h2>

                <p>
                    Masukkan data diri kamu dengan benar.
                </p>

            </div>


            <form id="registerForm">

                <!-- FOTO PROFIL -->
                <div class="photo-section">

                    <div class="photo-preview">
                        👤
                    </div>

                    <div>

                        <label for="photo">
                            Foto Profil
                        </label>

                        <input
                            type="file"
                            id="photo"
                            accept="image/*"
                        >

                        <small>
                            Opsional. Format JPG atau PNG.
                        </small>

                    </div>

                </div>


                <!-- NAMA -->
                <div class="form-group">

                    <label for="nama">
                        Nama Lengkap
                    </label>

                    <input
                        type="text"
                        id="nama"
                        placeholder="Masukkan nama lengkap"
                        required
                    >

                </div>


                <!-- NIM -->
                <div class="form-group">

                    <label for="nim">
                        NIM
                    </label>

                    <input
                        type="text"
                        id="nim"
                        placeholder="Masukkan NIM"
                        required
                    >

                </div>


                <!-- FAKULTAS & JURUSAN -->
                <div class="form-row">

                    <div class="form-group">

                        <label for="fakultas">
                            Fakultas
                        </label>

                        <select id="fakultas" required>

                            <option value="">
                                Pilih Fakultas
                            </option>

                            <option>
                                Fakultas Teknik
                            </option>

                            <option>
                                Fakultas Ekonomi dan Bisnis
                            </option>

                            <option>
                                Fakultas Hukum
                            </option>

                            <option>
                                Fakultas Pertanian
                            </option>

                            <option>
                                Fakultas Ilmu Sosial dan Ilmu Politik
                            </option>

                            <option>
                                Fakultas Matematika dan Ilmu Pengetahuan Alam
                            </option>

                            <option>
                                Fakultas Keguruan dan Ilmu Pendidikan
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="jurusan">
                            Program Studi
                        </label>

                        <input
                            type="text"
                            id="jurusan"
                            placeholder="Contoh: Teknik Informatika"
                            required
                        >

                    </div>

                </div>


                <!-- ANGKATAN -->
                <div class="form-group">

                    <label for="angkatan">
                        Angkatan
                    </label>

                    <select id="angkatan" required>

                        <option value="">
                            Pilih Angkatan
                        </option>

                        <option>2022</option>
                        <option>2023</option>
                        <option>2024</option>
                        <option>2025</option>
                        <option>2026</option>

                    </select>

                </div>


                <!-- EMAIL -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Masukkan email"
                        required
                    >

                </div>


                <!-- NOMOR HP -->
                <div class="form-group">

                    <label for="nohp">
                        Nomor WhatsApp
                    </label>

                    <input
                        type="tel"
                        id="nohp"
                        placeholder="Contoh: 081234567890"
                        required
                    >

                </div>


                <!-- TOMBOL -->
                <button
                    type="submit"
                    class="btn-register">

                    Simpan & Lanjutkan

                </button>

            </form>

        </div>

    </div>


    <script src="../js/register.js"></script>

</body>

</html>
