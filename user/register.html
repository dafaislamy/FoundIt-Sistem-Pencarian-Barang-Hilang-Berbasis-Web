<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lengkapi Profil - FoundIt</title>

    <!-- Bootstrap dan CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/bootstrap-override.css">
    <link rel="stylesheet" href="../css/register.css">
</head>
<body>

    <!-- CONTAINER REGISTRASI -->
    <div class="register-container container-fluid">
        <div class="row g-0 min-vh-100">

            <!-- BAGIAN KIRI -->
            <div class="col-lg-5 col-xl-4 register-info">
                <div class="logo"><span>Found</span>It</div>
                <h1>Lengkapi Profilmu.</h1>
                <p>Lengkapi data diri kamu agar dapat menggunakan seluruh fitur FoundIt.</p>

                <!-- Langkah registrasi -->
                <div class="steps">
                    <div class="step active">
                        <span>1</span>
                        <div><strong>Data Diri</strong><small>Informasi mahasiswa</small></div>
                    </div>
                    <div class="step">
                        <span>2</span>
                        <div><strong>Profil Selesai</strong><small>Mulai menggunakan FoundIt</small></div>
                    </div>
                </div>
            </div>

            <!-- BAGIAN KANAN -->
            <div class="col-lg-7 col-xl-8 register-box">
                <div class="register-header">
                    <h2>Data Mahasiswa</h2>
                    <p>Masukkan data diri kamu dengan benar.</p>
                </div>

                <!-- FORM REGISTRASI -->
                <form id="registerForm">

                    <!-- Upload foto profil -->
                    <div class="photo-section">
                        <div class="photo-preview">👤</div>
                        <div>
                            <label for="photo">Foto Profil</label>
                            <input type="file" id="photo" accept="image/*">
                            <small>Opsional. Format JPG atau PNG.</small>
                        </div>
                    </div>

                    <!-- Input nama lengkap -->
                    <div class="form-group">
                        <label for="nama">Nama Lengkap</label>
                        <input type="text" id="nama" class="form-control" placeholder="Masukkan nama lengkap" required>
                    </div>

                    <!-- Input NIM -->
                    <div class="form-group">
                        <label for="nim">NIM</label>
                        <input type="text" id="nim" class="form-control" placeholder="Masukkan NIM" required>
                    </div>

                    <!-- Pilihan fakultas dan program studi -->
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="fakultas">Fakultas</label>
                                <select id="fakultas" class="form-select" required>
                                    <option value="">Pilih Fakultas</option>
                                    <option>Fakultas Teknik</option>
                                    <option>Fakultas Ekonomi dan Bisnis</option>
                                    <option>Fakultas Hukum</option>
                                    <option>Fakultas Pertanian</option>
                                    <option>Fakultas Ilmu Sosial dan Ilmu Politik</option>
                                    <option>Fakultas Matematika dan Ilmu Pengetahuan Alam</option>
                                    <option>Fakultas Keguruan dan Ilmu Pendidikan</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="jurusan">Program Studi</label>
                                <input type="text" id="jurusan" class="form-control" placeholder="Contoh: Teknik Informatika" required>
                            </div>
                        </div>
                    </div>

                    <!-- Pilihan angkatan -->
                    <div class="form-group">
                        <label for="angkatan">Angkatan</label>
                        <select id="angkatan" class="form-select" required>
                            <option value="">Pilih Angkatan</option>
                            <option>2022</option>
                            <option>2023</option>
                            <option>2024</option>
                            <option>2025</option>
                            <option>2026</option>
                        </select>
                    </div>

                    <!-- Input email -->
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="Masukkan email" required>
                    </div>

                    <!-- Input nomor WhatsApp -->
                    <div class="form-group">
                        <label for="nohp">Nomor WhatsApp</label>
                        <input type="tel" id="nohp" class="form-control" placeholder="Contoh: 081234567890" required>
                    </div>

                    <!-- Tombol simpan -->
                    <button type="submit" class="btn-register">Simpan & Lanjutkan</button>
                </form>
            </div>

        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/register.js"></script>
</body>
</html>
